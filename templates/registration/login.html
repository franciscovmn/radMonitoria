{% extends "base.html" %}

{% block titulo %}Entrar - {{ block.super }}{% endblock %}

{% block conteudo %}
  <section class="caixa estreita">
    <h2>Entrar</h2>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}
      <button type="submit">Entrar</button>
    </form>

    <p class="discreto">Ainda não tem conta? <a href="{% url 'cadastro' %}">Criar conta</a></p>
  </section>
{% endblock %}
